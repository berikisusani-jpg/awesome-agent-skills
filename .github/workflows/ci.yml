name: Project FRIDAY CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pytest pytest-asyncio beautifulsoup4 slowapi
        pip install -r requirements.txt
    - name: Run tests
      run: |
        python -m pytest test_friday.py tests/
    - name: Smoke test (Brain instantiation)
      env:
        ANTHROPIC_API_KEY: sk-dummy
        SUPABASE_URL: https://dummy.supabase.co
        SUPABASE_KEY: dummy
      run: |
        python -c "from core.brain import FridayBrain; FridayBrain()"
